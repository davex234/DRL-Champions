<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sin conexión · NEXUS</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #e8ebf2;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; letter-spacing: .02em; }
  p { color: #a8afbf; margin: 0 0 1.5rem; }
  a { display: inline-block; padding: .7rem 1.4rem; border-radius: 8px; background: #e8ebf2; color: #0b0d12;
      font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<!-- F70.1 · la sirve el service worker cuando una navegación no llega al servidor. Sin datos de ninguna
     cuenta y sin script: dice que no hay conexión en vez de pintar otra pantalla. -->
<main data-offline="1">
  <h1>No hay conexión con el servidor</h1>
  <p>NEXUS no ha podido cargar esta página. Comprueba tu conexión y vuelve a intentarlo.</p>
  <a href="">Reintentar</a>
</main>
</body>
</html>
