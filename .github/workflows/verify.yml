# VERIFY — gate de calidad en cada push/PR (rápido, sin Rust). Si algo falla, no continúa.
name: verify

on:
  push:
  pull_request:

# Cancela ejecuciones anteriores del mismo ref (ahorra minutos).
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture (Release System)
        run: npm run release:arch

      - name: Updater verify
        run: npm run updater:verify

      - name: Cards verify
        run: npm run cards:verify

      - name: Release flow verify
        run: npm run release:verify
